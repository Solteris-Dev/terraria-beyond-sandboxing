# terraria-beyond-sandboxing -- configuration
#
# Sourced by bridge.sh and hooks/gate.sh. Everything auto-discovers, so a fresh
# clone should work with no edits and no installer. Override any value by
# exporting it before launching, or by uncommenting it here.

# --- where your Terraria server wrapper lives ------------------------------
# `tsrv` ships as its own project. We look for it on PATH, then next to this
# checkout, then in the usual spots. Set TSRV yourself to skip the search.
if [ -z "${TSRV:-}" ]; then
  for _c in \
      "$(command -v tsrv 2>/dev/null)" \
      "$(dirname "${BASH_SOURCE[0]}")/../tsrv/tsrv" \
      "$(dirname "${BASH_SOURCE[0]}")/../terraria-server/tsrv" \
      "$HOME/tsrv/tsrv" \
      "$HOME/Games/terraria-server/tsrv" \
      "$HOME/terraria-server/tsrv" \
      "$HOME/.local/share/terraria-server/tsrv" ; do
    [ -n "$_c" ] && [ -x "$_c" ] && { TSRV="$(cd "$(dirname "$_c")" && pwd)/$(basename "$_c")"; break; }
  done
  unset _c
fi

# The server's console log. tsrv knows where it keeps it, so ask rather than guess.
if [ -z "${SERVER_LOG:-}" ] && [ -n "${TSRV:-}" ] && [ -x "${TSRV:-}" ]; then
  SERVER_LOG="$("$TSRV" logpath 2>/dev/null)"
  [ -n "$SERVER_LOG" ] || SERVER_LOG="$(dirname "$TSRV")/logs/server.log"
fi

# Always defined, even when discovery finds nothing -- callers run with `set -u`
# and an unset variable would crash before they could print a useful message.
TSRV="${TSRV:-}"
SERVER_LOG="${SERVER_LOG:-}"

# --- interface -------------------------------------------------------------
# Trigger prefix for invoking the agent, and the interrupt/deny token.
TRIGGER='!'
VETO='!!!'

# Seconds the PreToolUse hook waits for a VETO before allowing.
# MUST stay well under the hook timeout in .claude/settings.json, because a
# timed-out hook renders NO decision and the tool proceeds (fail-open).
VETO_WINDOW=15

# Rotate to a fresh conversation after this much idle time (seconds). 4h.
IDLE_ROTATE=14400

# --- safety ----------------------------------------------------------------
# Writes are confined to these roots (colon-separated). This is a guardrail
# against an agent wandering, NOT a sandbox -- see the threat model in README.
ALLOWED_WRITE_ROOTS="$HOME/Games"

# Attribution only -- the server password is the real security boundary.
# Anyone who can join can invoke; listed players are merely labelled as trusted.
TRUSTED_PLAYERS=""   # e.g. "Alice Bob"
